package-as: LibPrettyPrint
# --------------------------
manual-changelog:
  filename: dev/changelog-release.md
  markup-type: markdown
license-output: LICENSE.txt
enable-nolib-creation: no

embedded-libraries:
  - LibStub

tools-used:
  - DevSuite
  - DebugChatFrame
  - Addon-Usage
  - Bugsack
  - Bug-Grabber

# Use GitHub because svn repos are slower
# basepath is ${package-as}
externals:
  ThirdParty/Libs/LibStub:
    url: https://github.com/lua-wow/LibStub
    tag: latest

ignore:
  - "dev"
  - "*.md"
  - "*.yaml"
  - "*.toml"
  - LICENSE
  - dev
  - doc
  - scripts
  - Interface
  - ThirdParty/Libs/LibStub/tests
  - Libs/Developer

